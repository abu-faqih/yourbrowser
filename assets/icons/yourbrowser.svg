<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF5500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF2A54;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#E0E0E0;stop-opacity:0.85" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="116" fill="url(#grad1)" filter="url(#shadow)"/>
  <!-- Orbit Ring -->
  <ellipse cx="128" cy="128" rx="100" ry="38" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-28 128 128)" opacity="0.6"/>
  <!-- Shield Icon -->
  <path d="M128 52 L184 76 C184 136 156 182 128 198 C100 182 72 136 72 76 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  <!-- Inner Lightning / Falcon Crest -->
  <path d="M132 84 L104 126 L124 126 L118 162 L152 116 L130 116 Z" fill="#FF3D00"/>
</svg>
